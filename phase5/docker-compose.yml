# Phase 2 唯一的第三方运行时依赖：本机 Docker 中的 PostgreSQL。
# 不使用宿主机已安装的 PostgreSQL，也不连接任何远程数据库。

services:
  postgres:
    image: postgres:17-alpine
    container_name: relayx-phase2-pg
    # 开发/压测环境的持久化取舍：关闭同步提交，把每条事务的 fsync 等待
    # 变成后台 WAL flush，避免本机 Docker 的磁盘成为吞吐瓶颈。
    # 进程崩溃不会丢已提交事务；OS 崩溃或断电可能丢失最近若干毫秒到数百毫秒的提交。
    # 生产环境应使用 synchronous_commit=on，并配合批量提交或更高规格存储。
    command: ["postgres", "-c", "synchronous_commit=off", "-c", "max_connections=100"]
    ports:
      # 只监听回环地址，避免暴露到局域网。
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: relayx
      POSTGRES_PASSWORD: relayx
      POSTGRES_DB: relayx
    volumes:
      - relayx-phase2-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relayx -d relayx"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  relayx-phase2-pgdata:
    name: relayx-phase2-pgdata
